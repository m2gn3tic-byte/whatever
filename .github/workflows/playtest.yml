name: Publish web playtest
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-playtest
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Test puzzle rules
        run: npm test
      - name: Build the repository Pages path
        run: npm run build -- --base /whatever/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved playtest
        id: deployment
        uses: actions/deploy-pages@v4
